<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/main.css">
    <title>Flexbox&Grid</title>
</head>

    <body>
        <header id="container">
                <div id="grid-container">

                    <div class="boxes" style="grid-area: box1;">
                        <div class="g1"><img src="./assets/edit.svg" alt="edit-photo" class="edit-img"></div>
                        <div class="g2">Edit to your <span class="sp1">Liking</span></div>
                    </div>

                    <div class="boxes" style="grid-area: box2;">
                        <div class="g3"><img src="./assets/psd.svg" alt="edit-photo2" class="edit-img2"></div>
                    </div>
                    <div class="boxes" style="grid-area: box3;">
                        <div class="g4"><img src="./assets/girl.svg" alt="edit-img3"></div>
                        <div class="g5">
                            <div class="girl-head">
                                <img src="./assets/infinite.svg" alt="infinity-img" class="infi">
                            </div>
                            <div class="girl-head">
                                Options
                            </div>
                        </div>
                    </div>
                    <div class="boxes" style="grid-area: box4;">

                        <div class="g6">
                            <div class="sh-1">Upgrade Discount</div>
                            <div class="sh-2">Upgrade today to enable <br> unlimited projects.</div>
                            <div class="sh-3">$14.99</div>
                        </div>

                        <div class="g7">
                            <div class="pal1"></div>
                            <div class="pal2"></div>
                            <div class="pal3"></div>
                            <div class="pal4"></div>
                            <div class="pal5"></div>
                        </div>
                    </div>
                    <div class="boxes" style="grid-area: box5;">
                            <div class="collab-container">
                                <div class="collab-box">
                                    <img src="./assets/collab.svg" alt="collaboration" class="collab-img">
                                </div>
                                <div class="collab-txt">
                                    Collaborate From <br><span class="sp2">ANYWHERE</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </header>
    </body>
</html>
